# 生产环境配置（示例，真值由 Secret/Nacos 注入，不入库）
# 该文件仅记录键名与说明，不含真实密钥。

APPLICATION_NAME: dataagent
RUN_ENV: prod
SERVER_ASGI: litestar
SERVER_RUNTIME: granian

# Pulsar 异步任务队列
DATAAGENT_USE_PULSAR: "true"
DATAAGENT_PULSAR_URL: ${ env.DATAAGENT_PULSAR_URL }
DATAAGENT_PULSAR_TOPIC: persistent://dataagent/prod/dataagent-jobs
DATAAGENT_PULSAR_DLQ: persistent://dataagent/prod/dataagent-jobs-dlq
DATAAGENT_PULSAR_SUBSCRIPTION: dataagent-workers
DATAAGENT_PULSAR_CONSUMER_CONCURRENCY: 32

# CockroachDB (PostgreSQL 兼容)
DATAAGENT_DATABASE_URL: ${ secret.DATAAGENT_DATABASE_URL }

# Redis
DATAAGENT_REDIS_URL: ${ secret.DATAAGENT_REDIS_URL }
DATAAGENT_REDIS_MAX_CONN: 64

# 图数据库（血缘/知识图谱）
DATAAGENT_NEBULA_ADDR: 10.167.2.175:9669
DATAAGENT_NEBULA_USER: root
DATAAGENT_NEBULA_PASSWORD: ${ secret.DATAAGENT_NEBULA_PASSWORD }
DATAAGENT_NEBULA_SPACE: dataagent

# 向量数据库（记忆/文档召回）
DATAAGENT_MILVUS_URI: http://10.167.2.175:30909
DATAAGENT_MILVUS_COLLECTION: agent_memory
DATAAGENT_MILVUS_DIM: 1024

# 百万并发 AI 网关（RateLimitV2 / 幂等 / 多租户配额）
DATAAGENT_GATEWAY_MAX_CONN: 100000
DATAAGENT_GATEWAY_LIMIT_RPS_PER_TENANT: 500
DATAAGENT_GATEWAY_BURST: 1000