apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataagent-api
  namespace: dataagent
  labels: {app: dataagent, tier: api}
spec:
  replicas: 20
  selector: {matchLabels: {app: dataagent-api}}
  template:
    metadata:
      labels: {app: dataagent-api}
    spec:
      containers:
        - name: api
          image: dataagent/api:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["granian", "--interface", "asgi", "-b", "0.0.0.0:8000",
                    "--workers", "2", "--threads", "8", "--loop", "rloop", "--http2",
                    "--respawn", "--lifetime", "3600", "services.api.asgi:app"]
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef: {name: dataagent-config}
            - secretRef: {name: dataagent-secrets}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
---
# Prometheus ServiceMonitor（若集群装了 Prometheus Operator；未装可注释）
# apiVersion: monitoring.coreos.com/v1
# kind: ServiceMonitor
# metadata:
#   name: dataagent-api
#   namespace: dataagent
# spec:
#   selector: {matchLabels: {app: dataagent-api}}
#   endpoints:
#     - {path: /metrics, port: http, interval: 15s}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dataagent-api-hpa
  namespace: dataagent
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: dataagent-api}
  minReplicas: 10
  maxReplicas: 200
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: v1
kind: Service
metadata:
  name: dataagent-api
  namespace: dataagent
spec:
  type: ClusterIP
  selector: {app: dataagent-api}
  ports: [{port: 80, targetPort: 8000, name: http}]