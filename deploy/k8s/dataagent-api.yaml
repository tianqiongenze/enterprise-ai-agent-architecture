---
# HPA 显式停用（docs/11 纪律）：内存仓储必须单进程；启用前置条件 =
# CRDB 持久化仓储 + 分布式队列 + 多副本一致性测试全绿（即 docs/12 GAP-14 worker Redis 后端联调完成）。
# 启用方法：取消注释并确认上述前置条件（参照工程同样将 KEDA/HPA 保持注释态）。
