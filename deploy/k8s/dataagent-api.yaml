apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataagent-api
  namespace: dataagent
  labels: {app: dataagent, tier: api}
spec:
  replicas: 20
  selector: {matchLabels: {app: dataagent-api}}
  template:
    metadata:
      labels: {app: dataagent-api}
    spec:
      containers:
        - name: api
          image: dataagent/api:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["granian", "--interface", "asgi", "--host", "0.0.0.0", "--port", "8000",
                    "--workers", "2", "--threads", "8", "--loop", "rloop",
                    "--respawn", "--lifetime", "3600", "services.api.asgi:app"]
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef: {name: dataagent-config}
            - secretRef: {name: dataagent-secrets}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
---
