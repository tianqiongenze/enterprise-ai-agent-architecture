# dataagent-prod 生产部署（含读写分离 GraphQL + metrics + 真实 CRDB）
apiVersion: v1
kind: ConfigMap
metadata:
  name: dataagent-config
  namespace: dataagent-prod
data:
  RUN_ENV: prod
  DATAAGENT_USE_PULSAR: "false"
  DATAAGENT_MODEL_DEFAULT: qwen2.5:14b
  DATAAGENT_MAX_ATTEMPTS: "2"
  DATAAGENT_LLM_GATEWAY: http://litellm.ai-platform.svc.cluster.local:4000
  DATAAGENT_DATABASE_HOST: cockroachdb.infra.svc.cluster.local
  DATAAGENT_DATABASE_PORT: "26257"
  DATAAGENT_DATABASE_NAME: dataagent
  DATAAGENT_DATABASE_URL: postgresql://root@cockroachdb.infra.svc.cluster.local:26257/dataagent
  DATAAGENT_REDIS_URL: redis://redis.infra.svc.cluster.local:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataagent-api
  namespace: dataagent-prod
  labels: {app: dataagent, tier: api}
spec:
  replicas: 2
  selector: {matchLabels: {app: dataagent-api}}
  template:
    metadata:
      labels: {app: dataagent-api}
    spec:
      containers:
          - name: api
            image: 10.100.135.132:5000/dataagent/api:0.2.0
            command: ["granian", "--interface", "asgi", "--host", "0.0.0.0", "--port", "8000",
                      "--workers", "2", "--loop", "auto", "services.api.asgi:app"]
            envFrom:
              - configMapRef: {name: dataagent-config}
            ports: [{containerPort: 8000, name: http}]
            readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
            livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 12, periodSeconds: 15}
            resources:
              requests: {cpu: "1", memory: 1Gi}
              limits: {cpu: "2", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: dataagent-api
  namespace: dataagent-prod
spec:
  type: NodePort
  selector: {app: dataagent-api}
  ports: [{port: 80, targetPort: 8000, nodePort: 30080, name: http}]
