apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataagent-worker
  namespace: dataagent
  labels: {app: dataagent, tier: worker}
spec:
  replicas: 5
  selector: {matchLabels: {app: dataagent-worker}}
  template:
    metadata:
      labels: {app: dataagent-worker}
    spec:
      containers:
        - name: worker
          image: dataagent/worker:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.worker.main"]
          envFrom:
            - configMapRef: {name: dataagent-config}
            - secretRef: {name: dataagent-secrets}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
---
