[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataagent"
version = "0.1.0"
description = "企业级多租户零售经营分析与决策 DataAgent ——《企业级 Agent 工程架构实战营》贯穿项目"
requires-python = ">=3.10"

[project.scripts]
dataagent-demo = "dataagent.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 覆盖率口径（GAP-02，诚实登记）：
# omit 三个"可选基建适配器"——离线套件无 SDK/DB 不可达，由环境门控 e2e 验证（tests/e2e）：
#   cockroach.py 需 asyncpg+CRDB；ollama.py 需 ollama SDK；litellm_gateway.py 需 litellm SDK。
# 这三个模块不计入分母，其余模块（1614 语句）全量参与度量。
[tool.coverage.run]
source = ["src/dataagent"]
omit = [
    "src/dataagent/adapters/llm/ollama.py",
    "src/dataagent/adapters/llm/litellm_gateway.py",
    "src/dataagent/infra/persistence/cockroach.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # 行长由 line-length 管，格式化工具职责
  "S101",   # assert 在测试与生产守卫中均为合法用法
  "B008",   # Litestar/DI 依赖注入惯例：函数调用作为默认参数
  "UP045", "UP037", "UP009", "UP035", "RUF100", "I001", "UP034",
  "RUF001", "RUF002", "RUF003",  # CJK 项目：中文歧义字符为天然形态（全注/全代码库误报）
  "UP042",  # StrEnum 迁移留待统一重构
  "E702",   # SQL 字符串内分号被误报（见 per-file-ignores 补充）
  "SIM102", "SIM105", "SIM108", "SIM103",  # 结构重构项：行为等价改写，本轮不改动避免引入行为差异
  "B007",   # 循环变量未用（占位迭代器）：不影响正确性
  "RUF005", # 集合字面量拼接语法：同 SIM 类风格改写
  "UP028",  # yield-in-for-loop：改为 yield from 需验证迭代器行为不变
]

[tool.ruff.lint.per-file-ignores]
"src/dataagent/infra/persistence/cockroach.py" = ["E702", "F841"]
"src/dataagent/adapters/llm/*" = ["B017", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/", "adapters/", "infra/persistence/cockroach.py"]
